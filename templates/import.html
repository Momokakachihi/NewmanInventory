<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Import | Newman</title>
<style>
*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;color:#4d2529;background:#f8f7f6;font:13px/1.45 Arial,sans-serif}.topbar{height:56px;color:#fff;background:#5b1719;border-bottom:2px solid #1593d0}.topbar-inner{max-width:1100px;height:100%;margin:auto;display:flex;align-items:center}.logo{display:flex;align-items:center;gap:10px;min-width:245px;padding:0 26px 0 4px;border-right:1px solid #8a4a4b}.logo-mark{width:38px;height:38px;object-fit:contain}.logo-name{font-size:19px;font-weight:800;letter-spacing:1px}.logo-sub{display:block;margin-top:-3px;font-size:6px;letter-spacing:.8px}.nav-link{display:flex;align-items:center;height:100%;gap:8px;padding:0 20px;color:#fff;border-bottom:3px solid transparent;text-decoration:none;font-weight:700}.nav-link:hover,.nav-link.active{border-bottom-color:#f6b83f}.nav-icon{width:15px;height:15px;object-fit:contain}.sign-in{margin-left:auto;padding:18px 20px;border-left:1px solid #8a4a4b;border-right:1px solid #8a4a4b;color:#fff;text-decoration:none;font-weight:700}main{max-width:760px;margin:36px auto;padding:24px;background:#fff;border:1px solid #e9e4e1;border-radius:7px}input,select,button{padding:11px;margin:6px 0;font:inherit}button{color:#fff;background:#5b1719;border:0;border-radius:4px}#result{margin-top:16px}.error{color:#ae321f}.ok{color:#25705c}@media(max-width:700px){.topbar{height:auto;min-height:56px}.topbar-inner{flex-wrap:wrap;padding:0 10px}.logo{flex:1 0 auto;min-width:0;padding-right:12px;border-right:0}.logo-name{font-size:15px}.logo-sub{display:none}.nav-link{height:46px;padding:0 9px;font-size:12px}.sign-in{flex:1 0 100%;margin:0;padding:10px;border:0;text-align:right;font-size:11px}}
</style></head>
<body><nav class="topbar"><div class="topbar-inner"><div class="logo"><img class="logo-mark" src="{{ url_for('static', filename='images/newman-logo.png') }}" alt="Newman logo"><div><span class="logo-name">NEWMANN</span><span class="logo-sub">4T'S TRUCKING SERVICES CORPORATION</span></div></div><a class="nav-link" href="/">Overview</a><a class="nav-link" href="/inventory">Inventory</a><a class="nav-link" href="/storage">Storage</a><a class="nav-link active" href="/import">Import</a><a class="nav-link" href="/report">Report</a><a class="nav-link" href="/delivery-report">Delivery Report</a><a class="nav-link" href="/sts">STS</a><a class="sign-in" href="#">♙ &nbsp; Login/Sign in</a></div></nav>
<main><h1>Import inventory workbook</h1><p>Upload the master .xlsx or .xlsb file. Matching No File scans will be reconciled automatically.</p><input id="file" type="file" accept=".xlsx,.xlsb"><div><select id="sheet" hidden></select><button id="import" hidden>Import rows</button></div><div id="result">No workbook selected.</div></main>
<script>
const $=id=>document.getElementById(id), result=$('result');
async function send(url,options){const response=await fetch(url,options);const data=await response.json();if(!response.ok)throw Error(data.error||'Request failed');return data;}
$('file').onchange=async()=>{const file=$('file').files[0];if(!file)return;const form=new FormData();form.append('file',file);result.textContent='Reading workbook...';try{const data=await send('/api/upload',{method:'POST',body:form});$('sheet').innerHTML=data.sheets.map(sheet=>`<option>${sheet}</option>`).join('');$('sheet').hidden=false;$('import').hidden=false;$('import').dataset.token=data.token;result.textContent=`${data.filename} is ready.`;result.className='ok';}catch(error){result.textContent=error.message;result.className='error';}};
$('import').onclick=async()=>{const form=new FormData();form.append('token',$('import').dataset.token);form.append('sheet',$('sheet').value);try{const data=await send('/api/import',{method:'POST',body:form});result.textContent=`Imported ${data.result.imported} new rows and updated ${data.result.updated} rows.`;result.className='ok';}catch(error){result.textContent=error.message;result.className='error';}};
</script></body></html>
