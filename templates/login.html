<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Newmann</title>
  <style>
    :root { --maroon:#5b1719; --gold:#f6b83f; --ink:#4d2529; --muted:#8d8582; --paper:#f8f7f6; }
    * { box-sizing: border-box; }
    body { display:grid; min-height:100vh; place-items:center; margin:0; color:var(--ink); background:var(--paper); font:14px Arial,sans-serif; }
    .panel { width:min(390px, calc(100% - 32px)); padding:30px; background:#fff; border:1px solid #e9e4e1; border-radius:8px; box-shadow:0 12px 28px #24352b0d; }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom:24px; color:var(--maroon); }
    .brand img { width:42px; height:42px; object-fit:contain; }
    .brand strong { display:block; font-size:20px; letter-spacing:1px; }
    .brand small { display:block; font-size:7px; letter-spacing:.8px; }
    h1 { margin:0 0 20px; color:var(--maroon); font-size:24px; }
    label { display:block; margin:14px 0 6px; color:var(--muted); font-size:12px; font-weight:700; text-transform:uppercase; }
    input, button { width:100%; padding:11px; border:1px solid #e9e4e1; border-radius:4px; font:inherit; }
    button { margin-top:20px; color:#fff; background:var(--maroon); border-color:var(--maroon); cursor:pointer; font-weight:700; }
    .error { margin:0 0 12px; color:#ae321f; }
  </style>
</head>
<body>
  <main class="panel">
    <div class="brand"><img src="{{ url_for('static', filename='images/newman-logo.png') }}" alt="Newman logo"><div><strong>NEWMANN</strong><small>4T'S TRUCKING SERVICES CORPORATION</small></div></div>
    <h1>Login / Sign in</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
