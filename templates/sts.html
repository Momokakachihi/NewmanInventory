<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>STS | Newman</title><style>*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;color:#4d2529;background:#f8f7f6;font:13px/1.45 Arial,sans-serif}.topbar{height:56px;color:#fff;background:#5b1719;border-bottom:2px solid #1593d0}.topbar-inner{max-width:1100px;height:100%;margin:auto;display:flex;align-items:center}.logo{display:flex;align-items:center;gap:10px;min-width:245px;padding:0 26px 0 4px;border-right:1px solid #8a4a4b}.logo-mark{width:38px;height:38px;object-fit:contain}.logo-name{font-size:19px;font-weight:800;letter-spacing:1px}.logo-sub{display:block;margin-top:-3px;font-size:6px;letter-spacing:.8px}.nav-link{display:flex;align-items:center;height:100%;gap:8px;padding:0 20px;color:#fff;border-bottom:3px solid transparent;text-decoration:none;font-weight:700}.nav-link:hover,.nav-link.active{border-bottom-color:#f6b83f}.nav-icon{width:15px;height:15px;object-fit:contain}.sign-in{margin-left:auto;padding:18px 20px;border-left:1px solid #8a4a4b;border-right:1px solid #8a4a4b;color:#fff;text-decoration:none;font-weight:700}main{max-width:1100px;margin:30px auto;padding:24px;background:#fff}table{width:100%;border-collapse:collapse;margin-bottom:25px}th,td{padding:9px;border-bottom:1px solid #e9e4e1;text-align:left}input{padding:7px;width:120px}@media(max-width:700px){.topbar{height:auto;min-height:56px}.topbar-inner{flex-wrap:wrap;padding:0 10px}.logo{flex:1 0 auto;min-width:0;padding-right:12px;border-right:0}.logo-name{font-size:15px}.logo-sub{display:none}.nav-link{height:46px;padding:0 9px;font-size:12px}.sign-in{flex:1 0 100%;margin:0;padding:10px;border:0;text-align:right;font-size:11px}}</style></head>
<body><nav class="topbar"><div class="topbar-inner"><div class="logo"><img class="logo-mark" src="{{ url_for('static', filename='images/newman-logo.png') }}" alt="Newman logo"><div><span class="logo-name">NEWMANN</span><span class="logo-sub">4T'S TRUCKING SERVICES CORPORATION</span></div></div><a class="nav-link" href="/"><img class="nav-icon" src="{{ url_for('static', filename='images/archives.png') }}" alt="">Overview</a><a class="nav-link" href="/inventory"><img class="nav-icon" src="{{ url_for('static', filename='images/inventory.png') }}" alt="">Inventory</a><a class="nav-link" href="/storage"><img class="nav-icon" src="{{ url_for('static', filename='images/inventory.png') }}" alt="">Storage</a><a class="nav-link" href="/import">Import</a><a class="nav-link" href="/report">Report</a><a class="nav-link" href="/delivery-report">Delivery Report</a><a class="nav-link active" href="/sts">STS</a><a class="sign-in" href="{{ url_for('logout') }}">♙ &nbsp; Logout</a></div></nav><main><h1>STS</h1><h2>Without DR</h2><div id="without"></div><h2>Assigned DR</h2><div id="assigned"></div></main>
<script>
function table(records){return `<table><thead><tr><th>Identifier</th><th>Frame</th><th>Engine</th><th>Model</th><th>DR number</th><th>Status</th><th>Location</th></tr></thead><tbody>${records.map(row=>`<tr><td>${row.identifier}</td><td>${row.frame||'-'}</td><td>${row.engine||'-'}</td><td>${row.model||'-'}</td><td><input data-id="${row.id}" value="${row.dr_number}" placeholder="DR number"></td><td>${row.status}</td><td>${row.location||'-'}</td></tr>`).join('')}</tbody></table>`;}
async function refresh(){const data=await fetch('/api/sts').then(response=>response.json());document.getElementById('without').innerHTML=table(data.records.filter(row=>!row.dr_number))||'<p>None.</p>';document.getElementById('assigned').innerHTML=table(data.records.filter(row=>row.dr_number))||'<p>None.</p>';document.querySelectorAll('input[data-id]').forEach(input=>{input.onchange=async()=>{const form=new URLSearchParams({dr_number:input.value});await fetch(`/api/sts/${input.dataset.id}`,{method:'PATCH',body:form});refresh();};});}refresh();
</script></body></html>
