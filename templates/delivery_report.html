<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Delivery Report | Newman</title><style>*{box-sizing:border-box}html,body{overflow-x:hidden}body{margin:0;color:#4d2529;background:#f8f7f6;font:13px/1.45 Arial,sans-serif}.topbar{height:56px;color:#fff;background:#5b1719;border-bottom:2px solid #1593d0}.topbar-inner{max-width:1100px;height:100%;margin:auto;display:flex;align-items:center}.logo{display:flex;align-items:center;gap:10px;min-width:245px;padding:0 26px 0 4px;border-right:1px solid #8a4a4b}.logo-mark{width:38px;height:38px;object-fit:contain}.logo-name{font-size:19px;font-weight:800;letter-spacing:1px}.logo-sub{display:block;margin-top:-3px;font-size:6px;letter-spacing:.8px}.nav-link{display:flex;align-items:center;height:100%;gap:8px;padding:0 20px;color:#fff;border-bottom:3px solid transparent;text-decoration:none;font-weight:700}.nav-link:hover,.nav-link.active{border-bottom-color:#f6b83f}.nav-icon{width:15px;height:15px;object-fit:contain}.sign-in{margin-left:auto;padding:18px 20px;border-left:1px solid #8a4a4b;border-right:1px solid #8a4a4b;color:#fff;text-decoration:none;font-weight:700}main{max-width:1100px;margin:30px auto;padding:24px;background:#fff}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e9e4e1;text-align:left}.dr{margin-top:24px}@media(max-width:700px){.topbar{height:auto;min-height:56px}.topbar-inner{flex-wrap:wrap;padding:0 10px}.logo{flex:1 0 auto;min-width:0;padding-right:12px;border-right:0}.logo-name{font-size:15px}.logo-sub{display:none}.nav-link{height:46px;padding:0 9px;font-size:12px}.sign-in{flex:1 0 100%;margin:0;padding:10px;border:0;text-align:right;font-size:11px}}</style></head>
<body><nav class="topbar"><div class="topbar-inner"><div class="logo"><img class="logo-mark" src="{{ url_for('static', filename='images/newman-logo.png') }}" alt="Newman logo"><div><span class="logo-name">NEWMANN</span><span class="logo-sub">4T'S TRUCKING SERVICES CORPORATION</span></div></div><a class="nav-link" href="/"><img class="nav-icon" src="{{ url_for('static', filename='images/archives.png') }}" alt="">Overview</a><a class="nav-link" href="/inventory"><img class="nav-icon" src="{{ url_for('static', filename='images/inventory.png') }}" alt="">Inventory</a><a class="nav-link" href="/storage"><img class="nav-icon" src="{{ url_for('static', filename='images/inventory.png') }}" alt="">Storage</a><a class="nav-link" href="/import">Import</a><a class="nav-link" href="/report">Report</a><a class="nav-link active" href="/delivery-report">Delivery Report</a><a class="nav-link" href="/sts">STS</a><a class="sign-in" href="{{ url_for('logout') }}">♙ &nbsp; Logout</a></div></nav><main><h1>Delivery report</h1><div id="content">Loading...</div></main>
<script>fetch('/api/delivery-report').then(response=>response.json()).then(data=>{const groups={};data.records.forEach(row=>(groups[row.dr_number]??=[]).push(row));document.getElementById('content').innerHTML=Object.entries(groups).map(([dr,rows])=>`<section class="dr"><h2>DR ${dr}</h2><table><thead><tr><th>Frame</th><th>Engine</th><th>Model</th><th>Destination</th><th>Dispatch date</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${row.frame||'-'}</td><td>${row.engine||'-'}</td><td>${row.model||'-'}</td><td>${row.destination||'-'}</td><td>${row.dispatch_date||'-'}</td></tr>`).join('')}</tbody></table></section>`).join('')||'<p>No DR records found.</p>';});</script></body></html>
